name: tests

# WHY THIS EXISTS
#
# On 3 September 2026 an old copy of a connector's source was uploaded over
# the live one. It silently removed working tools. /healthz returned "ok"
# throughout, because the app started perfectly well; it was just the wrong
# app. The regression stood in production for over an hour.
#
# This repo is the one that holds candidate data and outbound email, and
# until now it had no test run at all - the suite sat in the WRONG REPO,
# where it broke that repo's CI instead of protecting this one.
#
# Every push to main, and every pull request, before anyone trusts the
# deployment. A red cross on the commit is the signal /healthz can never
# give.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:        # lets you run it by hand from the Actions tab

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # 3.12 to match the Vercel runtime. A test passing on a different
      # version than production runs on is worth less than it looks.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
          # pytest is deliberately NOT in requirements.txt - that file is what
          # Vercel installs, and the production bundle has no business
          # carrying a test runner.

      # Catches a truncated or mis-pasted upload before pytest even starts,
      # and gives a clearer error than an import failure halfway through
      # collection. api/ not src/ - the Vercel entrypoint lives under api/.
      - name: Compile everything
        run: python -m compileall -q api tests

      - name: Run the suite
        run: python -m pytest tests/ -q
        # No secrets, no environment, no network. Every CATS and Graph call in
        # the tests is stubbed. Verified 5 September 2026: 290 passed and 3
        # xfailed on a clean 3.12 install with a completely empty environment.
        #
        # If this step ever starts needing a credential, something under test
        # has begun reaching the real org and THAT is the bug, not the missing
        # secret. Do not add one to make it go green - that exact shortcut was
        # proposed on 5 September and would have hidden ten misfiled test
        # files instead of finding them.
